<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}展厅换牌{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.clerk') }}">展厅换牌台</a>
    <nav>
      <a href="{{ url_for('main.clerk') }}">馆员工作台</a>
      <a href="{{ url_for('main.new_plan') }}">录入新方案</a>
      <a href="{{ url_for('main.gallery') }}">游客查号</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flashes">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    最少换牌 · 逐步核对 · 中断可续
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
